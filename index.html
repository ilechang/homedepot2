<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home Depot Mockup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  </head>

<body>
    <div class="container">
        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
          <img src="./logo.jpg" alt="Home Depot Logo" style="height: 40px;" class="me-5" >
      
          <div class="d-flex flex-grow-1 mx-5">
            <input class="form-control me-2" type="text" value="power drill" readonly>
            <button class="btn btn-warning" onclick="location.href='search-page.html'"><i class="bi bi-search"></i>
          </div>
      
          <div class="d-flex gap-3">
    
            <button class="btn btn-outline-secondary btn-sm ms-5">My Account</button>
            <button class="btn btn-outline-dark btn-sm">
              <i class="bi bi-cart"></i>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Popular search -->
      <div class="container">
        <div class="px-3 py-2">
          <strong>Popular Search</strong>
          <div class="d-flex flex-wrap gap-2 mt-2">
            <button class="btn btn-outline-secondary btn-sm">shower</button>
            <button class="btn btn-outline-secondary btn-sm">hammer</button>
            <button class="btn btn-outline-secondary btn-sm">nails</button>
            <button class="btn btn-outline-secondary btn-sm">bucket</button>
            <button class="btn btn-outline-secondary btn-sm">chisel</button>
            <button class="btn btn-outline-secondary btn-sm">spray paint</button>
            <button class="btn btn-outline-secondary btn-sm">chain saw</button>
            <button class="btn btn-outline-secondary btn-sm">gardening</button>
          </div>
        </div>
      </div>

    <!-- Cards -->
    <div class="container my-4">
        <div class="row g-4">

            <!-- Card 1 -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Big Spring Sale | Up to 30% off</h5>
                        <img src="./placeholder.jpg" class="img-fluid mb-3" alt="Spring Sale">
                        <a href="#" class="text-primary text-decoration-none">Shop now</a>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Buy again</h5>
                        <div class="row row-cols-2 g-2 mb-3">
                            <div class="col"><img src="./placeholder.jpg" class="img-fluid" alt="Item 1"></div>
                            <div class="col"><img src="./placeholder.jpg" class="img-fluid" alt="Item 2"></div>
                            <div class="col"><img src="./placeholder.jpg" class="img-fluid" alt="Item 3"></div>
                            <div class="col"><img src="./placeholder.jpg" class="img-fluid" alt="Item 4"></div>
                        </div>
                        <a href="#" class="text-primary text-decoration-none">More in Buy Again</a>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-md-4 mb-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">New releases from Apple</h5>
                        <img src="./placeholder.jpg" class="img-fluid mb-3" alt="Apple">
                        <a href="#" class="text-primary text-decoration-none">Shop now</a>
                    </div>
                </div>
            </div>

        </div>
        <div class="col-md-12 mb-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">other banner</h5>
                    <img src="./placeholder.jpg" class="w-100 mb-3" style="height: 300px; object-fit: cover;" alt="Apple">

                    <a href="#" class="text-primary text-decoration-none">Shop now</a>
                </div>
            </div>
        </div>
        <div class="col-md-12 mb-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">other banner</h5>
                    <img src="./placeholder.jpg" class="w-100 mb-3" style="height: 300px; object-fit: cover;" alt="Apple">

                    <a href="#" class="text-primary text-decoration-none">Shop now</a>
                </div>
            </div>
        </div>
        <div class="col-md-12 mb-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">other banner</h5>
                    <img src="./placeholder.jpg" class="w-100 mb-3" style="height: 300px; object-fit: cover;" alt="Apple">

                    <a href="#" class="text-primary text-decoration-none">Shop now</a>
                </div>
            </div>
            
        </div>
        <img class="mt-5 col-md-12" src="./footer.png" alt="">
        
    </div>

    <!-- Bootstrap JS (optional, not required here) -->
</body>

</html>
